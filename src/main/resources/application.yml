spring:
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/onpu}
    username: ${DATABASE_USERNAME:onpu}
    password: ${DATABASE_PASSWORD:onpu}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true

app:
  jwt:
    # 既定値は置かない。JWT_SECRET が無いと起動しない（設定忘れのまま、公開済みの鍵で動かないように）。
    # ローカル開発では local プロファイル（application-local.yml）の値を使う
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

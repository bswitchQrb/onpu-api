version: 2
updates:
  - package-ecosystem: gradle
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    open-pull-requests-limit: 5
    groups:
      gradle-minor-patch:
        update-types: [minor, patch]
    ignore:
      # jOOQ 3.20 以降（無料版）は Java 21 が必要。Java 21 に上げるまでは 3.19 系に止める
      - dependency-name: "org.jooq.jooq-codegen-gradle"
        versions: [">= 3.20"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Tokyo
    ignore:
      # ベースイメージのメジャー更新（Java のバージョンアップ）は手動で判断する
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
